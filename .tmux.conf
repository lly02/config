setw -g mode-keys vi
set -g mouse on
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "xclip -selection clipboard -in"
set-option -g history-limit 50000

set -g prefix C-a
unbind-key C-b
bind C-a send-prefix

bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

bind-key -r H resize-pane -L "5"
bind-key -r J resize-pane -D "5"
bind-key -r K resize-pane -U "5"
bind-key -r L resize-pane -R "5"

bind r source-file ~/.tmux.conf \; display "Config reloaded!"

bind-key f display-popup -E -w 60% -h 60% -T " System Info " -b rounded "fastfetch --config ~/.config/fastfetch/config.jsonc; sleep 300"

set -g window-status-format         "#[fg=colour16]#I:#W#{?window_zoomed_flag,*Z}"
set -g window-status-current-format "#[fg=colour127,bold]#I:#W#{?window_zoomed_flag,*Z,}#[default]"

set -g status-right "%d-%b %H:%M"
set -g status-justify centre
set -g status-left  ""

set-option -g allow-rename off
set-option -sg escape-time 100 # for win openssh beta

set-environment -g SSH_AUTH_SOCK "$HOME/.ssh/ssh_auth_sock"
set-option -g update-environment "DISPLAY SSH_ASKPASS SSH_AGENT_PID SSH_CONNECTION WINDOWID XAUTHORITY"

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

run '~/.tmux/plugins/tpm/tpm'
